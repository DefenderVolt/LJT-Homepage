locale: "en-US"
site_theme: "default"

title: "Junteng Liu's Homepage"
title_separator: "-"
name: "Junteng Liu"
description: "First-year PhD candidate in the HKUST NLP Group focusing on natural language processing and machine learning, including LLM reasoning and reinforcement learning, vision-language model hallucination, and LLM truthfulness and interpretability."
url: "https://defendervolt.github.io"
baseurl: "/LJT-Homepage"
repository: "DefenderVolt/LJT-Homepage"

author:
  avatar: "https://github.com/Vicent0205.png"
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group."
  employer: "HKUST NLP Group, Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

publication_category:
  manuscripts:
    title: "arXiv Papers"
  conferences:
    title: "Conference Papers"

breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider: false

atom_feed:
  hide: true
  path: ""

twitter:
  username: "junteng88716710"

social:
  type: "Person"
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://x.com/junteng88716710"
    - "mailto:jliugi@connect.ust.hk"

analytics:
  provider: false

include:
  - .htaccess
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - AGENTS.md
  - CHANGELOG
  - Capfile
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - Rakefile
  - README.md
  - _config_docker.yml
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - docker-compose.yaml
  - markdown_generator
  - node_modules
  - package.json*
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  comments: ["<!--", "-->"]
  ignore:
    envs: development
