name: Build and deploy Jekyll site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove template-only pages and sample files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for path in _pages/*; do
            name="$(basename "$path")"
            case "$name" in
              about.md|publications.html|404.md) ;;
              *) git rm -rf --ignore-unmatch "$path" ;;
            esac
          done

          git rm -rf --ignore-unmatch \
            _posts _drafts _teaching _talks _portfolio files \
            talkmap talkmap.ipynb talkmap.py talkmap_out.ipynb

          if ! git diff --cached --quiet; then
            git commit -m "Remove template demo pages and files"
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:master
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JavaScript
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production

      - name: Add Pages bypass file
        run: touch _site/.nojekyll

      - name: Publish _site to gh-pages
        run: |
          set -euo pipefail
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Junteng Liu homepage"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:gh-pages
